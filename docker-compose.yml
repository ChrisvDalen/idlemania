services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: idlemania
      POSTGRES_USER: idlemania
      POSTGRES_PASSWORD: idlemania
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idlemania -d idlemania"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
